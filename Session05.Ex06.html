<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style6.css">

<body>
    <h1>Center Align Text</h1>
    <p>To just center the text inside an element, use <span class="red">text-align: center;</span></p>
    <fieldset class="bro">
        <p>this text is centered</p>
    </fieldset>
    <div class="sub">
        <h2>Example</h2>
        <pre>
            <fieldset>
            <span class="brown">.center</span><span class="black">{</span>
            <span class="orange">text-align</span><span class="black">:</span> <span class="blue">center</span> <span class="black">;</span>
            <span class="orange">border</span><span class="black">:</span><span class="blue">3px solid green</span><span class="black">;</span>
            </fieldset> 
    </pre>
      <button type="submit">Try it yourself >> </button>
    </div>
</body>

</html>
